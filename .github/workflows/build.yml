name: Build

on:
  push:
    branches: [master, main, develop]
  workflow_dispatch:

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bzip2 \
            build-essential \
            pkg-config \
            libjpeg-dev \
            libcairo2-dev \
            libgif-dev \
            libpango1.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read package metadata
        id: meta
        run: |
          echo "package_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "package_name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          yarn install-build-dependencies
          yarn install --frozen-lockfile
          mkdir -p www

      - name: Build web bundle and sync Capacitor Android
        run: |
          sed -i -e 's/versionName "0.0.0"/versionName "${{ steps.meta.outputs.package_version }}"/g' android/app/build.gradle
          yarn prepare-prod-build
          yarn apply-diagnostic-modules
          npx jetifier
          yarn build:prod
          npx cap sync android

      - name: Build and sign Android APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew --project-dir android clean assembleRelease
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ${{ steps.meta.outputs.package_name }}-release-unsigned-${{ steps.meta.outputs.package_version }}.apk
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_SDK_ROOT/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 \
            ${{ steps.meta.outputs.package_name }}-release-unsigned-${{ steps.meta.outputs.package_version }}.apk \
            ${{ steps.meta.outputs.package_name }}-debug-${{ steps.meta.outputs.package_version }}.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks ./build/android/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            ${{ steps.meta.outputs.package_name }}-debug-${{ steps.meta.outputs.package_version }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blackout-Android-${{ steps.meta.outputs.package_version }}
          path: |
            ${{ steps.meta.outputs.package_name }}-debug-${{ steps.meta.outputs.package_version }}.apk
            ${{ steps.meta.outputs.package_name }}-release-unsigned-${{ steps.meta.outputs.package_version }}.apk
