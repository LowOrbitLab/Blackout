name: Build

on:
  push:
    branches: [master, main, develop]
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign with the configured Blackout release certificate
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bzip2 \
            build-essential \
            pkg-config \
            libjpeg-dev \
            libcairo2-dev \
            libgif-dev \
            libpango1.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read package metadata
        id: meta
        run: |
          echo "package_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "package_name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          yarn install-build-dependencies
          yarn install --frozen-lockfile
          mkdir -p www

      - name: Build web bundle and sync Capacitor Android
        run: |
          yarn prepare-prod-build
          yarn apply-diagnostic-modules
          npx jetifier
          yarn build:prod
          yarn verify:branding
          npx cap sync android

      - name: Build Android APKs
        run: |
          chmod +x android/gradlew
          ./android/gradlew --project-dir android clean assembleRelease -PblackoutVersionCode="$GITHUB_RUN_NUMBER"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk ${{ steps.meta.outputs.package_name }}-release-unsigned-${{ steps.meta.outputs.package_version }}.apk
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_SDK_ROOT/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 \
            ${{ steps.meta.outputs.package_name }}-release-unsigned-${{ steps.meta.outputs.package_version }}.apk \
            ${{ steps.meta.outputs.package_name }}-debug-${{ steps.meta.outputs.package_version }}.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks ./build/android/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            ${{ steps.meta.outputs.package_name }}-debug-${{ steps.meta.outputs.package_version }}.apk

      - name: Sign release APK
        if: ${{ inputs.sign_release == true }}
        env:
          BLACKOUT_KEYSTORE_BASE64: ${{ secrets.BLACKOUT_KEYSTORE_BASE64 }}
          BLACKOUT_KEYSTORE_PASSWORD: ${{ secrets.BLACKOUT_KEYSTORE_PASSWORD }}
          BLACKOUT_KEY_ALIAS: ${{ secrets.BLACKOUT_KEY_ALIAS }}
          BLACKOUT_KEY_PASSWORD: ${{ secrets.BLACKOUT_KEY_PASSWORD }}
        run: |
          test -n "$BLACKOUT_KEYSTORE_BASE64" && test -n "$BLACKOUT_KEYSTORE_PASSWORD" && test -n "$BLACKOUT_KEY_ALIAS" && test -n "$BLACKOUT_KEY_PASSWORD"
          BLACKOUT_KEYSTORE="$RUNNER_TEMP/blackout-release.keystore"
          trap 'rm -f "$BLACKOUT_KEYSTORE"' EXIT
          printf '%s' "$BLACKOUT_KEYSTORE_BASE64" | base64 --decode > "$BLACKOUT_KEYSTORE"
          BLACKOUT_BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT/build-tools/"* | sort -V | tail -n 1)
          "$BLACKOUT_BUILD_TOOLS/zipalign" -p -f 4 \
            "${{ steps.meta.outputs.package_name }}-release-unsigned-${{ steps.meta.outputs.package_version }}.apk" \
            "${{ steps.meta.outputs.package_name }}-release-${{ steps.meta.outputs.package_version }}.apk"
          "$BLACKOUT_BUILD_TOOLS/apksigner" sign --ks "$BLACKOUT_KEYSTORE" \
            --ks-key-alias "$BLACKOUT_KEY_ALIAS" --ks-pass env:BLACKOUT_KEYSTORE_PASSWORD --key-pass env:BLACKOUT_KEY_PASSWORD \
            "${{ steps.meta.outputs.package_name }}-release-${{ steps.meta.outputs.package_version }}.apk"
          "$BLACKOUT_BUILD_TOOLS/apksigner" verify --verbose \
            "${{ steps.meta.outputs.package_name }}-release-${{ steps.meta.outputs.package_version }}.apk"


      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blackout-Android-${{ steps.meta.outputs.package_version }}
          path: |
            ${{ steps.meta.outputs.package_name }}-debug-${{ steps.meta.outputs.package_version }}.apk
            ${{ steps.meta.outputs.package_name }}-release-unsigned-${{ steps.meta.outputs.package_version }}.apk
            ${{ steps.meta.outputs.package_name }}-release-${{ steps.meta.outputs.package_version }}.apk
