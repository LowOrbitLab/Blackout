name: Deploy Blackout preview to Netlify

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Prepare
        run: yarn install --frozen-lockfile

      # 网页预览使用不含 Sapling 参数的构建。
      - name: Build site
        run: yarn run build:no-sapling

      - name: Deploy Site
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx --yes netlify-cli@17 deploy --dir=www --alias="$GITHUB_SHA" --message="$GITHUB_SHA"
