<ion-header class="ion-no-border">
  <ion-toolbar color="secondary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab-settings"></ion-back-button>
    </ion-buttons>

    <ion-title>{{ 'error-history.title' | translate }}</ion-title>

    <ion-buttons slot="end">
      <ion-button class="button-has-icon-only" (click)="copyErrorHistory()">
        <ion-icon slot="icon-only" name="copy-outline"></ion-icon>
      </ion-button>
      <ion-button class="button-has-icon-only" (click)="clearErrors()">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="ok-error-history">
    <div *ngIf="errorHistory.length === 0" class="ok-settings-section ok-error-empty">
      <ion-icon name="checkmark-circle-outline"></ion-icon>
      <p>{{ 'error-history.empty_label' | translate }}</p>
    </div>

    <ion-card *ngFor="let error of errorHistory" class="ok-error-card" (click)="error.expanded = !error.expanded">
      <div class="ok-error-card__header">
        <span class="ok-error-card__date">{{ error.date | date: 'yyyy-MM-dd HH:mm' }}</span>
        <span class="ok-error-card__badge">
          {{ 'error-history.details_label' | translate }}
          <ion-icon [name]="error.expanded ? 'chevron-up-outline' : 'chevron-down-outline'"></ion-icon>
        </span>
      </div>

      <div class="ok-error-card__body">
        <p *ngIf="!error.expanded" class="ok-error-card__summary">{{ error.title }}</p>
        <pre *ngIf="error.expanded" class="ok-error-card__trace">{{ error.detail }}</pre>
      </div>
    </ion-card>
  </div>
</ion-content>
