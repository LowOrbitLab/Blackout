<ion-header class="ion-no-border">
  <ion-toolbar color="secondary">
    <ion-title>{{ 'tab-secrets.title' | translate }}</ion-title>
    <ion-buttons slot="primary" (click)="presentPopover($event)">
      <ion-button>
        <ion-icon slot="icon-only" name="ellipsis-horizontal"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar color="secondary">
    <ion-searchbar
      placeholder="{{ 'tab-secrets.search_placeholder' | translate }}"
      (ionInput)="filterItems($event)"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- The entrance stagger is for the first paint only: toggling between the
       filtered and unfiltered templates rebuilds the cards, and replaying the
       cascade on every keystroke reads as flicker. The unfiltered branch must
       bind the source array directly: SecretsService mutates and re-emits the
       same instance, which a pure pipe would not pick up. -->
  <div class="ok-secret-list" [class.ok-stagger]="!searchUsed">
    <ng-container *ngIf="secretFilter; else unfiltered">
      <blackout-secret-item
        *ngFor="let secret of secrets | async | secretFilter: { label: secretFilter }; trackBy: trackBySecretId"
        [secret]="secret"
      ></blackout-secret-item>
    </ng-container>

    <ng-template #unfiltered>
      <blackout-secret-item *ngFor="let secret of secrets | async; trackBy: trackBySecretId" [secret]="secret"></blackout-secret-item>
    </ng-template>

    <button type="button" class="add-secret_card" (click)="addSecret()">
      <ion-icon name="add"></ion-icon>
      <span>{{ 'tab-secrets.add-secret_label' | translate }}</span>
    </button>
  </div>
</ion-content>
