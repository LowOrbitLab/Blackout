<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ 'introduction.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="ok-intro" *ngIf="installationType !== installationTypes.UNDETERMINED">
    <img
      class="ok-intro__art"
      alt=""
      [src]="installationType === installationTypes.OFFLINE ? 'assets/img/companion-apps.svg' : 'assets/img/app-switching.svg'"
    />

    <div class="ok-intro__heading">
      <span class="ok-intro__icon">
        <ion-icon [name]="installationType === installationTypes.OFFLINE ? 'cloud-offline-outline' : 'wifi-outline'"></ion-icon>
      </span>
      <!-- The device type is translated before it is interpolated; the raw
           enum value used to show up as "OFFLINE" in the middle of a sentence -->
      <h1
        [innerHTML]="'introduction.header' | translate: { installationType: ('introduction.device-type.' + installationType | translate) }"
      ></h1>
    </div>

    <p *ngIf="installationType === installationTypes.ONLINE; else offlineDesc">
      {{ 'introduction.online-desc' | translate }}
    </p>
    <ng-template #offlineDesc>
      <p>{{ 'introduction.offline-desc' | translate }}</p>
    </ng-template>

    <p *ngIf="installationType === installationTypes.OFFLINE">
      {{ 'introduction.offline-companion_text' | translate }}
    </p>

    <ion-button
      *ngIf="installationType === installationTypes.ONLINE"
      class="ok-intro__install"
      expand="block"
      shape="round"
      color="tertiary"
      (click)="downloadApp()"
    >
      {{ 'introduction.wallet_install_label' | translate }}
    </ion-button>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-button shape="round" color="primary" (click)="accept()">{{ 'introduction.skip_label' | translate }}</ion-button>
  </ion-fab>
</ion-content>
