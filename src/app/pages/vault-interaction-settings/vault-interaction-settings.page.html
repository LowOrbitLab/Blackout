<ion-header class="ion-no-border">
  <ion-toolbar color="secondary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab-settings"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'vault-interaction-settings.heading' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="ok-vault-interaction-top">
    <div class="ok-settings-section">
      <ion-item lines="none">
        <ion-icon name="wifi-outline" slot="start"></ion-icon>
        <ion-label class="ion-text-wrap">{{ 'vault-interaction-settings.device-connected_text' | translate }}</ion-label>
        <ion-toggle [checked]="connectionEnabled" (ionChange)="toggleEnableConnection($event)" slot="end"></ion-toggle>
      </ion-item>
    </div>
    <p class="ok-settings-note" [innerHTML]="'vault-interaction-settings.note_text' | translate"></p>

    <ng-container *ngIf="connectionEnabled">
      <ion-list-header>
        <ion-label>{{ 'interaction-selection-settings.title' | translate }}</ion-label>
      </ion-list-header>
      <airgap-interaction-selection></airgap-interaction-selection>
    </ng-container>
  </div>
</ion-content>
