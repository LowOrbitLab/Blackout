<ion-header class="ion-no-border">
  <ion-toolbar color="secondary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab-settings"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'contact-book.title_settings' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="ok-contact-settings-top">
    <div class="ok-settings-section">
      <ion-item>
        <ion-icon name="book-outline" slot="start"></ion-icon>
        <ion-label>{{ 'contact-book.label_enable_address_book' | translate }}</ion-label>
        <ion-toggle [checked]="bookEnabled" (ionChange)="toggleAddressBook($event)" slot="end"></ion-toggle>
      </ion-item>
      <ion-item lines="none">
        <ion-icon name="bulb-outline" slot="start"></ion-icon>
        <ion-label>{{ 'contact-book.label_enable_suggestions' | translate }}</ion-label>
        <ion-toggle [checked]="suggestionsEnabled" (ionChange)="toggleEnableSuggestions($event)" slot="end"></ion-toggle>
      </ion-item>
    </div>

    <div class="ok-settings-section ok-settings-section--last">
      <ion-item button lines="none" detail="false" class="ok-settings-item--danger" (click)="onClickDelete()">
        <ion-icon name="trash-outline" slot="start"></ion-icon>
        <ion-label>{{ 'contact-book.button_delete_entries' | translate }}</ion-label>
      </ion-item>
    </div>
  </div>
</ion-content>
