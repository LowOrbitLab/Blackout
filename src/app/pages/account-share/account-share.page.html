<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab-secrets"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'wallet-share.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="ok-share">
    <p class="ok-share__heading" [innerHTML]="'wallet-share.heading' | translate: { walletName: walletName }"></p>

    <div class="ok-share__qr" *ngIf="interactionUrl">
      <airgap-iac-qr
        [messageDefinitionObjects]="interactionUrl"
        [qrFormatPreference]="companionApp.qrType"
        [level]="'L'"
        [size]="300"
      ></airgap-iac-qr>
    </div>

    <p class="ok-share__text" [innerHTML]="'wallet-share.text' | translate"></p>

    <div class="ok-share__details" *ngIf="interactionUrl">
      <ion-item lines="none">
        <ion-label>{{ 'wallet-share.qr-details_label' | translate }}</ion-label>
        <ion-toggle
          slot="end"
          [attr.aria-label]="'wallet-share.qr-details_label' | translate"
          [checked]="displayRawData"
          (ionChange)="displayRawData = !displayRawData"
        ></ion-toggle>
      </ion-item>
    </div>

    <div class="ok-share__raw" *ngIf="interactionUrl && displayRawData">
      <pre class="ion-no-margin">{{ interactionUrl | json }}</pre>
      <div class="ok-share__raw-actions">
        <ion-button color="tertiary" shape="round" (click)="copyToClipboard()">{{ 'wallet-share.copy-data_label' | translate }}</ion-button>
        <ion-button color="primary" shape="round" (click)="done()">{{ 'wallet-share.done_label' | translate }}</ion-button>
      </div>
    </div>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed" *ngIf="!displayRawData">
    <ion-button color="primary" shape="round" (click)="done()">{{ 'wallet-share.done_label' | translate }}</ion-button>
  </ion-fab>
</ion-content>
