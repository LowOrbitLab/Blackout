<ion-header>
  <ion-toolbar color="secondary">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="defaulBacktHref"></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="primary">
      <ion-button (click)="help()">
        <ion-icon slot="icon-only" name="help-circle"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ 'social-recovery-import.header_title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="content-wrapper">
    <div class="center-wrapper">
      <div class="states-wrapper">
        <airgap-progress-indicator [currentShare]="currentShareNumber" [totalShares]="numberOfShares"></airgap-progress-indicator>
      </div>
    </div>
  </div>
  <h4 class="font--weight__med">{{ 'social-recovery-import.share-name.heading' | translate }}</h4>
  <p>{{ 'social-recovery-import.share-name.text' | translate }}</p>

  <ion-item>
    <form [formGroup]="socialRecoveryForm">
      <ion-input
        type="text"
        fill="none"
        [label]="'social-recovery-import.share-name.placeholder' | translate"
        label-placement="floating"
        formControlName="shareName"
      ></ion-input>
    </form>
  </ion-item>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-button (click)="nextState()" color="primary" shape="round" [disabled]="!shareName || shareName.length === 0">
      {{ 'social-recovery-import.setup.confirm_label' | translate }}
    </ion-button>
  </ion-fab>
</ion-content>
