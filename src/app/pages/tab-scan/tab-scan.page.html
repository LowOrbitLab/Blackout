<ion-header class="ion-no-border ok-scan-header" [class.is-camera]="isMobile && (hasCameraPermission | async)">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'tab-scan.title' | translate }}</ion-title>
    <ion-buttons slot="end" *ngIf="torchAvailable">
      <button
        type="button"
        class="ok-torch-btn"
        [class.is-active]="torchEnabled"
        [attr.aria-pressed]="torchEnabled"
        (click)="toggleTorch()"
        aria-label="Flashlight"
      >
        <ion-icon [name]="torchEnabled ? 'flashlight' : 'flashlight-outline'"></ion-icon>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content forceOverscroll="false" [scrollY]="false" [class.transparent]="hasCameraPermission | async">
  <!-- Camera layer + viewfinder -->
  <div *ngIf="hasCameraPermission | async" class="ok-scan-layout">
    <zxing-scanner
      #scanner
      class="ok-zxing-layer"
      [formats]="['QR_CODE']"
      [timeBetweenScans]="0"
      [delayBetweenScanSuccess]="0"
      [torch]="torchEnabled"
      *ngIf="isBrowser || isElectron"
      (torchCompatible)="onTorchCompatible($event)"
      (scanSuccess)="checkScan($event)"
    ></zxing-scanner>

    <div class="ok-viewfinder-stage">
      <div class="ok-viewfinder-box" [class.is-receiving]="isMultiQr">
        <span class="ok-corner ok-corner--tl"></span>
        <span class="ok-corner ok-corner--tr"></span>
        <span class="ok-corner ok-corner--bl"></span>
        <span class="ok-corner ok-corner--br"></span>
        <div class="ok-laser-track"><div class="ok-laser"></div></div>
      </div>
    </div>

    <div class="ok-scan-footer">
      <h2 class="ok-scan-footer__heading">{{ 'tab-scan.text' | translate }}</h2>

      <div class="ok-scan-progress" *ngIf="isMultiQr">
        <p class="ok-scan-footer__subtext">{{ 'tab-scan.multi-qr_text' | translate }}</p>
        <div class="ok-scan-segments" role="progressbar" aria-valuemin="0" aria-valuemax="100" [attr.aria-valuenow]="percentageScanned * 100">
          <span *ngFor="let seg of progressSegments" class="ok-scan-segment">
            <span class="ok-scan-segment__fill" [style.transform]="'scaleX(' + segmentFill(seg) + ')'"></span>
          </span>
        </div>
        <div class="ok-scan-frame-counter">{{ percentageScanned | percent }}</div>
      </div>
    </div>
  </div>

  <!-- Camera permission empty state -->
  <div *ngIf="(hasCameraPermission | async) === false" class="ok-scan-permission" (click)="requestPermission()">
    <img src="../assets/img/permission_onboarding_camera.svg" alt="" />
    <h3 [innerHTML]="'tab-scan.empty-state_heading' | translate"></h3>
    <ion-button shape="round" color="primary">{{ 'tab-scan.grant-permission_label' | translate }}</ion-button>
  </div>
</ion-content>
