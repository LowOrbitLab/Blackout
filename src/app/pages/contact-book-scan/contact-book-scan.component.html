<ion-header class="ion-no-border ok-scan-header" [class.is-camera]="isMobile && (hasCameraPermission | async)">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'contact-book-scan.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content forceOverscroll="false" [scrollY]="false" [class.transparent]="hasCameraPermission | async">
  <div *ngIf="hasCameraPermission | async" class="ok-scan-layout">
    <zxing-scanner
      #scanner
      class="ok-zxing-layer"
      [formats]="['QR_CODE']"
      [timeBetweenScans]="0"
      [delayBetweenScanSuccess]="0"
      *ngIf="isBrowser || isElectron"
      (scanSuccess)="checkScan($event)"
    ></zxing-scanner>

    <div class="ok-viewfinder-stage">
      <div class="ok-viewfinder-box">
        <span class="ok-corner ok-corner--tl"></span>
        <span class="ok-corner ok-corner--tr"></span>
        <span class="ok-corner ok-corner--bl"></span>
        <span class="ok-corner ok-corner--br"></span>
        <div class="ok-laser-track"><div class="ok-laser"></div></div>
      </div>
    </div>

    <div class="ok-scan-footer">
      <h2 class="ok-scan-footer__heading">{{ 'contact-book-scan.text' | translate }}</h2>
    </div>
  </div>

  <div *ngIf="(hasCameraPermission | async) === false" class="ok-scan-permission" (click)="requestPermission()">
    <img src="../assets/img/permission_onboarding_camera.svg" alt="" />
    <h3 [innerHTML]="'contact-book-scan.empty-state_heading' | translate"></h3>
    <ion-button shape="round" color="primary">{{ 'contact-book-scan.grant-permission_label' | translate }}</ion-button>
  </div>
</ion-content>
