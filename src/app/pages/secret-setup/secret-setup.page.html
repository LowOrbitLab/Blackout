<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button *ngIf="canGoBack"></ion-back-button>
      <ion-button
        *ngIf="!canGoBack && context$ | async as context"
        (click)="context === 'knox' ? goToOnboardingWelcomePage() : goToInstallationTypePage()"
      >
        <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>{{ 'secret-setup.heading' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="ok-setup-options ok-stagger">
    <button type="button" class="ok-setup-option" (click)="goToGenerate()">
      <span class="ok-setup-option__icon"><ion-icon src="assets/icons/md-edit.svg"></ion-icon></span>
      <span class="ok-setup-option__body">
        <span class="ok-setup-option__title">{{ 'secret-setup.generate.label' | translate }}</span>
        <span class="ok-setup-option__text">{{ 'secret-setup.generate.text' | translate }}</span>
      </span>
      <ion-icon class="ok-setup-option__chevron" name="chevron-forward"></ion-icon>
    </button>

    <button type="button" class="ok-setup-option" (click)="goToImport()">
      <span class="ok-setup-option__icon"><ion-icon src="assets/icons/md-vertical_align_bottom.svg"></ion-icon></span>
      <span class="ok-setup-option__body">
        <span class="ok-setup-option__title">{{ 'secret-setup.import.label' | translate }}</span>
        <span class="ok-setup-option__text">{{ 'secret-setup.import.text' | translate }}</span>
      </span>
      <ion-icon class="ok-setup-option__chevron" name="chevron-forward"></ion-icon>
    </button>

    <button type="button" class="ok-setup-option" (click)="goToSocialRecoveryImport()">
      <span class="ok-setup-option__icon"><ion-icon src="assets/icons/md-people.svg"></ion-icon></span>
      <span class="ok-setup-option__body">
        <span class="ok-setup-option__title">{{ 'secret-setup.social-recovery.label' | translate }}</span>
      </span>
      <ion-icon class="ok-setup-option__chevron" name="chevron-forward"></ion-icon>
    </button>
  </div>

  <ion-list lines="none" class="ok-setup-advanced">
    <ion-item class="ok-setup-toggle">
      <ion-label>{{ 'secret-setup.advanced' | translate }}</ion-label>
      <ion-toggle color="primary" slot="end" [(ngModel)]="isAdvancedMode"></ion-toggle>
    </ion-item>

    <ng-container *ngIf="isAdvancedMode">
      <div class="ok-setup-advanced__body">
        <ion-item lines="none" [detail]="false" class="ok-setup-warning" [color]="'warning'">
          <ion-icon slot="start" name="warning-outline"></ion-icon>
          <ion-label class="ion-text-wrap">
            <h3>{{ 'secret-setup.advanced' | translate }}</h3>
            <h4 [innerHTML]="'secret-setup.advanced_warning' | translate"></h4>
          </ion-label>
        </ion-item>

        <button type="button" class="ok-setup-option" (click)="goToDiceRollPage()">
          <span class="ok-setup-option__icon"><ion-icon name="dice-outline"></ion-icon></span>
          <span class="ok-setup-option__body">
            <span class="ok-setup-option__title">{{ 'secret-setup.dice-roll.label' | translate }}</span>
            <span class="ok-setup-option__text">{{ 'secret-setup.dice-roll.text' | translate }}</span>
          </span>
          <ion-icon class="ok-setup-option__chevron" name="chevron-forward"></ion-icon>
        </button>

        <button type="button" class="ok-setup-option" (click)="goToCoinFlipPage()">
          <span class="ok-setup-option__icon"><ion-icon name="ellipse-outline"></ion-icon></span>
          <span class="ok-setup-option__body">
            <span class="ok-setup-option__title">{{ 'secret-setup.coin-flip.label' | translate }}</span>
            <span class="ok-setup-option__text">{{ 'secret-setup.coin-flip.text' | translate }}</span>
          </span>
          <ion-icon class="ok-setup-option__chevron" name="chevron-forward"></ion-icon>
        </button>
      </div>
    </ng-container>
  </ion-list>
</ion-content>
