<ion-header transparent class="ion-no-border">
  <ion-toolbar transparent>
    <ion-title>{{ title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- A block, not an ion-row: in a flex row the paragraphs and the list of the
       translated HTML stopped collapsing their margins and drifted apart -->
  <div class="ok-warning-body ion-padding-horizontal" [innerHtml]="description"></div>

  <ion-row class="ion-justify-content-center" *ngIf="imageUrl"><img class="warning-img" [src]="imageUrl" /></ion-row>

  <ion-fab *ngIf="buttonText" vertical="bottom" horizontal="end" slot="fixed">
    <ion-button default (click)="handler()" color="primary" shape="round" item-right>{{ buttonText }}</ion-button>
  </ion-fab>
</ion-content>
