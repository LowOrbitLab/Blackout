<ion-header class="ion-no-border">
  <ion-toolbar color="secondary">
    <ion-title>{{ 'isolated-modules-onboarding.title' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button class="button-has-icon-only" (click)="back()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <airgap-isolated-modules-onboarding></airgap-isolated-modules-onboarding>

  <div class="ion-padding"></div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-button shape="round" color="primary" (click)="acknowledge()">
      {{ 'isolated-modules-onboarding.content.button_label' | translate }}
    </ion-button>
  </ion-fab>
</ion-content>
