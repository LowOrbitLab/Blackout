<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/secret-edit"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="content-wrapper">
    <div class="center-wrapper">
      <!-- Same stepper as the share display page; the inline copy numbered the
           shares from 0 -->
      <blackout-progress-indicator [currentShare]="currentShare" [totalShares]="shares.length"></blackout-progress-indicator>
      <h2>{{ 'social-recovery-validate-share.text' | translate }}</h2>
      <blackout-verify-key-alt
        *ngIf="shares"
        #verify
        [secret]="shares[currentShare]"
        (onComplete)="onComplete($event)"
        (onNext)="onNext()"
      ></blackout-verify-key-alt>
    </div>

    <div class="buttons-wrapper">
      <ion-button color="light" fill="clear" (click)="prev()">{{ 'social-recovery-setup.back_label' | translate }}</ion-button>
      <ion-button color="light" fill="clear" fill="clear" (click)="next()" [disabled]="!validated">
        {{ 'social-recovery-setup.next_label' | translate }}
      </ion-button>
    </div>
  </div>
</ion-content>
