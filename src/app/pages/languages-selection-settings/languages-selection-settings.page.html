<ion-header class="ion-no-border">
  <ion-toolbar color="secondary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab-settings"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'language-selection-settings.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="ok-lang-top">
    <div class="ok-settings-section">
      <ion-item button lines="none" detail="false" (click)="defaultToDevice()">
        <ion-icon name="globe-outline" slot="start"></ion-icon>
        <ion-label>
          {{ 'language-selection-settings.selector.device' | translate }}
        </ion-label>
        <ion-badge *ngIf="isDeviceLanguageSelected" color="success" class="ok-lang-system-badge" slot="end">
          ✓
        </ion-badge>
      </ion-item>
    </div>

    <ion-list-header>
      <ion-label>{{ 'language-selection-settings.heading' | translate }}</ion-label>
    </ion-list-header>

    <div class="ok-settings-section ok-settings-section--last">
      <ion-radio-group [value]="selectedType" (ionChange)="changeLanguage($event.detail.value)">
        <ion-item
          *ngFor="let language of languages; let last = last"
          [lines]="last ? 'none' : 'inset'"
          detail="false"
        >
          <ion-label>{{ 'language-selection-settings.selector.' + language | translate }}</ion-label>
          <ion-radio slot="end" [value]="language"></ion-radio>
        </ion-item>
      </ion-radio-group>
    </div>
  </div>
</ion-content>
