<ion-tabs #tabs (ionTabsDidChange)="tabChange(tabs)">
  <ion-tab-bar slot="bottom" class="ok-tab-bar">
    <ion-tab-button tab="tab-secrets" class="ok-tab-button">
      <ion-icon name="wallet-outline"></ion-icon>
      <ion-label>{{ 'tabs.secrets' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab-scan" class="ok-tab-button ok-tab-button--scan">
      <div class="ok-scan-pill">
        <ion-icon name="qr-code-outline"></ion-icon>
        <ion-label>{{ 'tabs.scanner' | translate }}</ion-label>
      </div>
    </ion-tab-button>

    <ion-tab-button tab="tab-settings" class="ok-tab-button">
      <ion-icon name="settings-outline"></ion-icon>
      <ion-label>{{ 'tabs.settings' | translate }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
