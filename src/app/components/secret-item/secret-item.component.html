<ion-card class="ok-vault-card" (click)="goToAccountsList()">
  <div class="ok-vault-card__top">
    <div class="ok-vault-card__identity">
      <div class="ok-vault-card__avatar" *ngIf="(isAdvancedMode$ | async) && lifehashData; else defaultVaultAvatar">
        <img class="lifehash" [src]="lifehashData" alt="" />
        <span class="ok-vault-card__verified-dot" *ngIf="secret.isParanoia">
          <ion-icon name="shield-checkmark"></ion-icon>
        </span>
      </div>
      <ng-template #defaultVaultAvatar>
        <div class="ok-vault-card__avatar ok-vault-card__avatar--fallback">
          <ion-icon name="lock-closed"></ion-icon>
          <span class="ok-vault-card__verified-dot" *ngIf="secret.isParanoia">
            <ion-icon name="shield-checkmark"></ion-icon>
          </span>
        </div>
      </ng-template>

      <div class="ok-vault-card__meta">
        <div class="ok-vault-card__title-row">
          <ion-card-title class="secret--label">{{ secret.label }}</ion-card-title>
          <span class="ok-vault-card__fingerprint" *ngIf="(isAdvancedMode$ | async) && secret.fingerprint">
            {{ secret.fingerprint | slice: 0:8 }}
          </span>
        </div>

        <div class="ok-vault-card__badges" *ngIf="secret.isParanoia || secret.hasSocialRecovery">
          <span class="ok-badge ok-badge--success" *ngIf="secret.isParanoia">
            <ion-icon name="shield"></ion-icon>
            <span>BIP-39 Passphrase</span>
          </span>
          <span class="ok-badge ok-badge--neutral" *ngIf="secret.hasSocialRecovery">
            <ion-icon name="extension-puzzle"></ion-icon>
            <span>Social Recovery</span>
          </span>
        </div>
      </div>
    </div>

    <ion-icon class="ok-vault-card__chevron" name="chevron-forward-outline"></ion-icon>
  </div>

  <div class="ok-vault-card__footer" *ngIf="activeWallets && activeWallets.length > 0">
    <div class="ok-vault-card__coins">
      <span class="airgap-currency-symbol-secret" *ngFor="let wallet of activeWallets">
        <airgap-currency-symbol [symbol]="wallet.symbol" [protocolIdentifier]="wallet.protocolIdentifier"></airgap-currency-symbol>
      </span>
      <span *ngIf="hasMoreWallets > 0" class="ok-vault-card__more">+{{ hasMoreWallets }}</span>
    </div>
    <span class="ok-vault-card__count">{{ activeWallets.length + hasMoreWallets }}</span>
  </div>
</ion-card>
