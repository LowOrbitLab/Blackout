<ng-container *ngFor="let address of addressesNotOnContactBook">
  <div class="suggestion-wrapper">
    <p>{{ 'contact-book.suggestion.not-in-book_text' | translate }}</p>
    <div class="divider">
      <airgap-identicon class="image" [address]="address"></airgap-identicon>
      <span>{{ address }}</span>
    </div>
    <p>{{ 'contact-book.suggestion.add_question' | translate }}</p>
    <div class="divider-buttons">
      <ion-button class="button" color="tertiary" (click)="onClickDontAddContact(address)">
        {{ 'contact-book.suggestion.no_label' | translate }}
      </ion-button>
      <ion-button class="button" color="tertiary" (click)="onClickAddContact(address)">
        {{ 'contact-book.suggestion.yes_label' | translate }}
      </ion-button>
    </div>
    <ion-button class="button" color="primary" (click)="onClickDisableContact()">
      {{ 'contact-book.suggestion.disable_label' | translate }}
    </ion-button>
  </div>
</ng-container>
