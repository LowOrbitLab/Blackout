<div class="ok-settings-section ok-interaction-section">
  <ion-radio-group [(ngModel)]="selectedType" (ionChange)="changeInteraction($event.detail.value)">
    <ion-item detail="false">
      <ion-icon name="phone-portrait-outline" slot="start"></ion-icon>
      <ion-label [ngClass]="{ selected: selectedType === interactionType.DEEPLINK }">
        {{ 'interaction-selection-settings.selector.same-device' | translate }}
      </ion-label>
      <ion-radio slot="end" [value]="interactionType.DEEPLINK"></ion-radio>
    </ion-item>
    <ion-item detail="false">
      <ion-icon name="qr-code-outline" slot="start"></ion-icon>
      <ion-label [ngClass]="{ selected: selectedType === interactionType.QR_CODE }">
        {{ 'interaction-selection-settings.selector.offline-device' | translate }}
      </ion-label>
      <ion-radio slot="end" [value]="interactionType.QR_CODE"></ion-radio>
    </ion-item>
    <ion-item lines="none" detail="false">
      <ion-icon name="help-circle-outline" slot="start"></ion-icon>
      <ion-label [ngClass]="{ selected: selectedType === interactionType.ALWAYS_ASK }">
        {{ 'interaction-selection-settings.selector.always' | translate }}
      </ion-label>
      <ion-radio slot="end" [value]="interactionType.ALWAYS_ASK"></ion-radio>
    </ion-item>
  </ion-radio-group>
</div>
